# =============================================================================
# Manufacturing ERP - Project tooling configuration
# =============================================================================

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".venv",
    "venv",
    ".git",
    "__pycache__",
    "migrations",
    "staticfiles",
    "media",
    "*.md",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]
"**/migrations/*.py" = ["E", "W", "F", "I", "B", "C4", "UP", "DJ"]
"**/tests/*.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "common", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_tests.py"]
testpaths = ["tests", "apps"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["apps", "common", "config"]
omit = ["*/migrations/*", "*/tests/*", "config/settings/*", "manage.py", "config/celery.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
